# ColdPlayersPlus - PvP bots (ColdMC). /cpp pvp reload re-reads this file.
#
# A PvP bot is an ordinary ColdPlayersPlus bot with a fighting brain attached. It is a real
# player to the server: it takes real damage (armour, enchantments, effects, knockback), hits
# through the server's own attack code (crits, sprint knockback, sweeping), dies and respawns
# like anyone else, and inside KitPvP it joins the arena, picks a kit and plays by KitPvP's rules
# (spawn protection, safe zones, soup, kit abilities, kill credit).
#
# The brain is held to human limits set per profile below: reaction time, aim error, turn speed,
# clicks per second, missed swings, imperfect strafing and mistakes. A trained model (see
# "learning") changes WHAT the bot chooses to do, never those limits - so training makes bots
# play more like people, not superhuman.
#
# Commands (permission cpp.pvp, default op): /cpp pvp help

enabled: true

# While no real player is in a KitPvP arena world (or a free-fight world), every PvP bot lets go of
# its keys and stands still, auto-fill neither adds nor removes bots, and nothing is recorded. They
# pick up again within a second of a player arriving. A bot sent after someone with
# /cpp pvp fight stays awake.
idle-when-empty: true

# Most PvP bots that may be active at once (assigned by command and auto-fill together).
max-bots: 8

kitpvp:
  # Use KitPvP when it is installed: bots join its arena and fight only other KitPvP players.
  enabled: true
  # Arena bots join. '' = KitPvP's default arena.
  arena: ''
  # Kits a bot may pick. [] = every enabled, non-hidden kit that needs no permission (VIP/MVP kits
  # stay with ranked players unless listed here). Bots never pay for a kit.
  kits: []
  # Tier a bot equips: a number, or "max" for the kit's top tier, or "random".
  kit-tier: 1
  # How long a bot "browses the menu" after spawning or dying before it picks a kit, seconds.
  pick-kit-seconds: {min: 2, max: 6}

  # Keep the arena populated. Bots are spawned and removed by this alone; bots you assign by
  # command are never removed by it.
  auto-fill:
    enabled: true
    # Always at least this many bots in the arena.
    min-bots: 2
    # Add bots until real players + bots reach this, and take bots away as real players arrive.
    fill-to: 6
    check-seconds: 20
    # A new bot draws its profile from this list (repeat a name to make it more likely).
    profiles: [rookie, casual, casual, skilled]
    # Where a new bot appears before it joins (it is moved to the arena by KitPvP).
    # '' = the arena's first spawn.
    spawn-location: ''

# Duel queues (the owner, 2026-11-25). A real player who waits alone in a duel queue this many seconds,
# while an arena for it is free, is matched with a PvP bot: an idle one in the arena (not duelling,
# not in combat), or a new one if none is free and max-bots allows. For that duel the bot plays a
# profile drawn from the list (repeat a name to make it more likely), then goes back to its own.
# 0 = bots never fill a queue.
duels:
  fill-after-seconds: 20
  profiles: [skilled, veteran]

# Names for bots spawned by auto-fill and /cpp pvp spawn. A free one is picked at random.
# [] = "Bot" + 4 digits. A name that is a real account wears that account's skin
# (skin.by-name in config.yml).
