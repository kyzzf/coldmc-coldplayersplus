combat:
  # Bots go after real players.
  bots-target-players: true
  # Bots fight each other with no human involved.
  bots-target-bots: true
  # How far a bot looks for someone to fight, blocks.
  target-range: 24
  # Outside KitPvP (kitpvp.enabled false, or the bot is not in it): worlds where an assigned bot
  # may fight anyone in range. [] = nowhere; bots outside KitPvP then only fight on /cpp pvp fight.
  free-worlds: []
  # Killing a bot gives no MMOCore experience. Fighting and Archery pay 50 EXP per player kill,
  # and Kit PvP kills count (MMOCore pays even on the deaths Kit PvP calls off), so without this
  # bots could be farmed for levels. Done by tagging every bot the way MMOCore tags spawner mobs.
  no-kill-exp: true
  # Bots never pick, chase or hit anyone standing where WorldGuard denies pvp, and never swing
  # from such a spot themselves. (Unset pvp counts as allowed, as in WorldGuard.)
  respect-worldguard: true
  # Bots leave anyone within this many blocks of an arena spawn alone, do not fight from inside
  # it, and roam outside it. Covers production's kitpvpsafe region, which has no pvp flag.
  # 0 = off (then only KitPvP's own spawn protection and Safe-Radius apply).
  spawn-safe-radius: 10
  # A bot never sets blocks on fire: flint and steel, fire charges, fireballs and burning arrows
  # it causes do not light anything. Players it hits can still burn.
  start-fires: false
  # In KitPvP arena worlds, lava never lights blocks and fire never spreads or burns blocks - for
  # everyone, because Prisoner's lava has no player attached and set arena maps alight on dev.
  # Fire on players (fire aspect, Dragon, Pyro) is untouched.
  no-arena-fire: true
  # Never walk into the void, lava, fire or a drop deeper than this.
  max-safe-drop: 4

right-click:
  # Right-clicking a bot opens its inventory (or its settings when sneaking). In these worlds that
  # never happens, so a right-click aimed at a bot is an ordinary one (drinking soup). Every
  # KitPvP arena world is always included. A name matches when the world's name starts with it.
  blocked-worlds: [instance, world_kitbattle]

respawn:
  # Outside KitPvP a bot that dies is brought back by ColdPlayersPlus' own death.respawn-on-death
  # (config.yml). Inside KitPvP, KitPvP respawns it at the arena spawn and the bot picks a kit again.
  # true = a PvP bot that was removed by death outside KitPvP is spawned again and re-armed.
  reattach-after-death: true

learning:
  # Record how REAL players fight in KitPvP (bots are never recorded). Only gameplay numbers are
  # kept: distances, angles, health, armour, held weapon strength, the keys held (forward, back,
  # left, right, jump, sprint), swings, soups and the result of each fight. No names, no UUIDs,
  # no chat, no IPs: a player is a salted 8-character tag that cannot be turned back into a name.
  collect: true
  # Also record real players while they fight bots. Off: the model learns only from fights between
  # two real players.
  record-vs-bots: false
  # A real player who has pressed no key, turned no further than half a degree, swung nothing and
  # right-clicked nothing for this long is AFK: nothing is recorded for them, and nobody's fight
  # against them is recorded either.
  afk-seconds: 5
  # A fight is kept only once the player has dealt at least this much damage AND taken at least
  # this much (1 = half a heart). Until then its samples are held back; a fight that never gets
  # there - standing near someone, a one-sided hit, an AFK target - is thrown away unwritten.
  min-damage-dealt: 1
  min-damage-taken: 1
  # TESTING ONLY: also record bots (labelled with what their own brain chose), written to
  # observations-test/ instead of observations/, to try the pipeline with no real player online.
  # Never train a real model on it - bots would learn from bots.
  test-record-bots: false
  # One observation every N ticks per fighting player (2 = ten a second).
  sample-every-ticks: 2
  # Folder inside plugins/ColdPlayersPlus/ for observations and the model.
  folder: pvp-learning
  # Observations are buffered in memory and written by a background thread this often.
  flush-seconds: 30
  # A new observation file is started this often (each file is gzipped CSV).
  file-minutes: 60
  # In-memory buffer limit; beyond it the oldest unwritten observations are dropped.
  max-queue: 20000
  # When observation files reach this size on disk, collection pauses (and the console says so).
  # Nothing is deleted unless retention-days is set.
  max-disk-mb: 1024
  # Observation files older than this are removed. 0 = keep forever.
  retention-days: 0

  # The trained model (written by the trainer on another computer, uploaded here).
  model-file: combat-model.txt
  # Re-read the model when the file changes, checked this often (0 = only on /cpp pvp model reload).
  # A new model is checked before use and swapped in between two ticks; a bad file is refused
  # and the bots keep the model (or heuristic) they had.
  watch-model-seconds: 60

# Bot skill. A bot gets one profile; `default` fills in anything a profile leaves out.
# reaction-ms / cps / soup-ticks / refill-ticks: {min, max}.
